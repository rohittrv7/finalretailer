<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retailer POS Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .splash-card {
      width: 480px;
      height: 310px;
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.96) 0%, rgba(10, 15, 29, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(59, 130, 246, 0.15),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Ambient background glow */
    .glow-sphere {
      position: absolute;
      top: -30px;
      width: 220px;
      height: 140px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(139, 92, 246, 0.15) 50%, transparent 70%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
    }

    .header {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 4px;
    }

    .logo-container {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 14px;
      border-radius: 22px;
      padding: 4px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(139, 92, 246, 0.4), rgba(16, 185, 129, 0.4));
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
      display: block;
      background: #0f172a;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(120deg, #f8fafc 20%, #38bdf8 65%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      margin-top: 6px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Footer & Loading Bar */
    .loading-section {
      position: relative;
      z-index: 1;
      width: 100%;
      margin-bottom: 4px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .status-text {
      color: #cbd5e1;
      transition: all 0.3s ease;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8 0%, #6366f1 50%, #10b981 100%);
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      transition: width 0.4s ease-out;
      animation: initialProgress 1.6s ease-out forwards;
    }

    @keyframes initialProgress {
      0% { width: 5%; }
      30% { width: 45%; }
      70% { width: 85%; }
      100% { width: 98%; }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="glow-sphere"></div>

    <div class="header">
      <div class="logo-container">
        <img class="logo-img" src="icon.png" alt="Retailer POS" />
      </div>
      <h1 class="brand-title">Retailer POS Terminal</h1>
      <p class="brand-subtitle">Smart Offline Billing & Inventory</p>
      <div class="badge">
        <span class="badge-dot"></span>
        <span>v1.0.0 • Ravana Engine</span>
      </div>
    </div>

    <div class="loading-section">
      <div class="status-row">
        <span class="status-text" id="statusLabel">Initializing local database...</span>
        <span style="font-feature-settings: 'tnum';">100% Offline</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    const messages = [
      { at: 350, text: 'Connecting Ravana SQLite engine...' },
      { at: 750, text: 'Loading GST tax engine & slabs...' },
      { at: 1100, text: 'Preparing billing workspace...' },
      { at: 1400, text: 'Ready!' }
    ];

    const label = document.getElementById('statusLabel');
    messages.forEach(msg => {
      setTimeout(() => {
        if (label) label.innerText = msg.text;
      }, msg.at);
    });
  </script>
</body>
</html>
